<!DOCTYPE html>
<html lang="id" style="background-color:#0A0A0C;color-scheme:dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hairiyah Tania — Portofolio{% endblock %}</title>
    <style>html,body{background-color:#0A0A0C}</style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    {% block head %}{% endblock %}
</head>
<body>
    <header>
        <a href="/" class="logo"><span>T</span>ania</a>
        <nav>
            <a href="/" class="{% if request.path == '/' %}active{% endif %}">Home</a>
            <a href="/about" class="{% if request.path == '/about' %}active{% endif %}">About</a>
            <a href="/skills" class="{% if request.path == '/skills' %}active{% endif %}">Skills</a>
            <a href="/projects" class="{% if request.path == '/projects' %}active{% endif %}">Projects</a>
            <a href="/blog" class="{% if request.path == '/blog' %}active{% endif %}">Blog</a>
            <a href="/contact" class="{% if request.path == '/contact' %}active{% endif %}">Contact</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        &copy; 2026 Hairiyah Tania &mdash; Mahasiswa Informatika
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
